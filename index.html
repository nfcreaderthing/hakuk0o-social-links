<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4dfe4" />
    <meta
      name="description"
      content="Social links and class schedule."
    />
    <title>Links</title>
    <style>
      :root {
        --rose: #efd3da;
        --blush: #f7e8e9;
        --paper: #fff9f5;
        --ink: #171516;
        --muted: #766d70;
        --green: #a4d2b5;
        --green-deep: #638c72;
        --pink: #e998ad;
        --line: rgba(23, 21, 22, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--rose);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.74), transparent 18rem),
          radial-gradient(circle at 86% 88%, rgba(164, 210, 181, 0.48), transparent 20rem),
          repeating-linear-gradient(0deg, rgba(23, 21, 22, 0.025) 0 1px, transparent 1px 4px),
          var(--rose);
      }

      body::before,
      body::after {
        position: fixed;
        z-index: 0;
        color: rgba(23, 21, 22, 0.86);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        letter-spacing: 1.8rem;
        line-height: 2.5;
        pointer-events: none;
        white-space: pre-wrap;
      }

      body::before {
        top: -20px;
        left: 1%;
        width: 98%;
        content: "★  ★  ★  ★  ★  ★  ★  ★\A  ★  ★  ★  ★  ★  ★  ★  ★";
        opacity: 0.72;
        transform: rotate(-2deg);
      }

      body::after {
        right: -36px;
        bottom: -35px;
        content: "★\A\A  ★\A\A★";
        font-size: 3rem;
        line-height: 1.8;
        opacity: 0.34;
        transform: rotate(12deg);
      }

      .page {
        position: relative;
        z-index: 1;
        display: grid;
        width: min(100% - 28px, 680px);
        min-height: 100vh;
        margin: 0 auto;
        place-items: center;
        padding: 60px 0 36px;
      }

      .card {
        position: relative;
        width: 100%;
        overflow: hidden;
        padding: clamp(28px, 7vw, 52px);
        border: 1px solid rgba(23, 21, 22, 0.24);
        border-radius: 28px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.74), transparent 40%),
          rgba(255, 249, 245, 0.82);
        box-shadow:
          0 24px 70px rgba(88, 51, 58, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
      }

      .card::before {
        position: absolute;
        top: 25px;
        right: 27px;
        width: 62px;
        height: 25px;
        border: 2px solid var(--green-deep);
        border-radius: 50%;
        content: "";
        opacity: 0.48;
        transform: rotate(-12deg);
      }

      .card::after {
        position: absolute;
        right: -70px;
        bottom: -75px;
        width: 230px;
        height: 230px;
        border: 1px solid rgba(99, 140, 114, 0.3);
        border-radius: 50%;
        box-shadow:
          0 0 0 16px rgba(99, 140, 114, 0.08),
          0 0 0 32px rgba(99, 140, 114, 0.05);
        content: "";
      }

      .stamp {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--green-deep);
        font-size: 0.68rem;
        font-weight: 850;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transform: rotate(-2deg);
      }

      .stamp::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green-deep);
        box-shadow: 0 0 8px rgba(99, 140, 114, 0.7);
        content: "";
      }

      h1 {
        position: relative;
        z-index: 1;
        max-width: 390px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 12vw, 5.8rem);
        font-weight: 400;
        letter-spacing: -0.08em;
        line-height: 0.82;
      }

      h1 em {
        display: block;
        color: var(--pink);
        font-style: italic;
        text-shadow: 1px 1px 0 var(--ink);
      }

      .intro {
        position: relative;
        z-index: 1;
        max-width: 390px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.65;
      }

      .rule {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 1px;
        margin: 28px 0 18px;
        background: linear-gradient(90deg, var(--ink), transparent);
      }

      .links {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 11px;
      }

      .link {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 66px;
        padding: 9px 14px 9px 10px;
        color: var(--ink);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.38);
        transition:
          transform 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .link:hover,
      .link:focus-visible {
        background: rgba(164, 210, 181, 0.42);
        box-shadow: 0 10px 22px rgba(88, 51, 58, 0.14);
        outline: none;
        transform: translateY(-3px) rotate(-0.5deg);
      }

      .icon {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        place-items: center;
        border: 1px solid rgba(23, 21, 22, 0.24);
        border-radius: 12px;
        background: var(--paper);
      }

      .icon svg {
        width: 21px;
        height: 21px;
        fill: var(--ink);
      }

      .copy {
        display: grid;
        gap: 3px;
        min-width: 0;
      }

      .copy strong {
        font-size: 0.94rem;
        font-weight: 850;
      }

      .copy span {
        overflow: hidden;
        color: var(--muted);
        font-size: 0.76rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .arrow {
        margin-left: auto;
        color: var(--green-deep);
        font-size: 1.25rem;
      }

      .footer {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        margin-top: 25px;
        color: rgba(23, 21, 22, 0.54);
        font-size: 0.65rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      @media (max-width: 480px) {
        .page {
          width: min(100% - 16px, 680px);
          padding-top: 44px;
        }

        .card {
          border-radius: 21px;
          padding: 30px 20px 24px;
        }

        body::before {
          font-size: 1.5rem;
          letter-spacing: 0.9rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <div class="stamp">social links</div>
        <h1 id="page-title">Stay <em>close.</em></h1>
        <p class="intro">Find the links below.</p>
        <div class="rule"></div>

        <nav class="links" aria-label="Social and class schedule links">
          <a
            class="link"
            href="https://www.facebook.com/hakuk0o"
            target="_blank"
            rel="noreferrer"
          >
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.5-1.5h1.7V4a22 22 0 0 0-2.5-.1c-2.5 0-4.2 1.5-4.2 4.3V10H7.5v3H10v8h3.5Z"></path>
              </svg>
            </span>
            <span class="copy">
              <strong>Facebook</strong>
              <span>hakuk0o</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>

          <a
            class="link"
            href="https://www.tiktok.com/@hakuk0o_"
            target="_blank"
            rel="noreferrer"
          >
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M15.2 3c.3 1.8 1.3 3 3.1 3.2v3a7 7 0 0 1-3.1-.8v6.2a5.4 5.4 0 1 1-4.7-5.3v3.1a2.4 2.4 0 1 0 1.6 2.2V3h3.1Z"></path>
              </svg>
            </span>
            <span class="copy">
              <strong>TikTok</strong>
              <span>@hakuk0o_</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>

          <a
            class="link"
            href="https://www.canva.com/design/DAHRJaQ9g7Y/O20gTvc5txMGJr1yJfZLeg/edit"
            target="_blank"
            rel="noreferrer"
          >
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                <path d="M8 7h8M8 11h8M8 15h5"></path>
              </svg>
            </span>
            <span class="copy">
              <strong>Class schedule</strong>
              <span>Open Canva schedule</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </nav>

        <div class="footer">
          <span>03 links</span>
          <span>↘</span>
        </div>
      </section>
    </main>
  </body>
</html>
